<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Gemi Rotasyon</title><style>body{background:#eef3f6;color:#163a4e;font:16px -apple-system,Arial;margin:0}main{max-width:520px;margin:auto;padding:14px}header{background:#06455c;color:white;padding:23px;border-radius:15px}section{background:white;border-radius:15px;padding:17px;margin:13px 0}input,button{font-size:18px;box-sizing:border-box;min-height:46px;border-radius:8px;padding:8px;width:100%;border:1px solid #aac0cc;background:white;color:#12394d}button{background:#126481;color:white;margin-top:10px;font-weight:bold}label{display:block;font-weight:bold;font-size:13px;margin-top:12px;margin-bottom:5px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:20px;border-radius:12px;background:#dcecfb;margin-top:12px}.answer.off{background:#dbf1e3}.answer strong{font-size:32px;display:block}.answer span{font-size:13px}#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}#calendar button{font-size:12px;margin:0;min-height:44px;padding:3px;color:#174b70;background:#dcecfb;border:0}#calendar button.off{background:#def0e4;color:#146443}#calendar button:disabled{background:#f2f2f2;color:#bbb}.small{font-size:12px;color:#647c8b}#msg{font-weight:bold;color:green}</style><main><header><small>⚓ DENİZCİ ASİSTANI</small><h1>Gemi Rotasyon</h1><span>Çalışma ve izin takvimi</span></header><section><h3>⚙️ Ayarlar</h3><label>İlk katılış</label><input id="first" type="date" value="2026-11-15"><div class="pair"><div><label>Gemide gün</label><input id="work" type="number" min="1" value="42"></div><div><label>İzin gün</label><input id="leave" type="number" min="1" value="42"></div></div><label>Toplam döngü</label><input id="cycle" type="number" min="2" value="84"><p class="small">Döngü değişince izin günleri güncellenir.</p><button id="save">AYARLARI KAYDET</button><p id="msg"></p></section><section><h3>📅 Tarih Kontrolü</h3><label>Tarih seç</label><input id="query" type="date" value="2027-08-15"><button id="check">TARİHİ KONTROL ET</button><div id="result" class="answer"><strong id="state">GEMİDE</strong><div id="details"></div></div><button id="today">BUGÜN</button></section><section><h3>🗓️ Aylık Takvim</h3><div class="pair"><button id="prev">‹</button><button id="next">›</button></div><h4 id="month"></h4><div class="small">🔵 Gemi &nbsp; 🟢 İzin</div><div id="calendar"></div></section></main><script>(function(){var D=86400000,c={first:'2026-11-15',work:42,leave:42},q='2027-08-15',y=2027,m=7;function el(x){return document.getElementById(x)}function time(s){return Date.parse(s+'T00:00:00Z')}function iso(x){return new Date(x).toISOString().slice(0,10)}function fmt(x){return new Date(x).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})}function state(s){var t=time(s),n=Math.round((t-time(c.first))/D);if(!Number.isFinite(n)||n<0)return null;var p=n%(c.work+c.leave),on=p<c.work,len=on?c.work:c.leave,idx=on?p:p-c.work;return {on:on,idx:idx,len:len,next:t+(len-idx)*D}}function show(s){var a=state(s);if(!a){el('msg').textContent='İlk katılıştan sonraki bir tarih seç.';return}q=s;el('query').value=s;el('state').textContent=a.on?'GEMİDE':'İZİNLİ';el('result').className='answer'+(a.on?'':' off');el('details').textContent=fmt(time(s))+' — '+(a.idx+1)+'. gün / '+a.len+' gün. Sonraki dönem: '+fmt(a.next);var d=new Date(time(s));y=d.getUTCFullYear();m=d.getUTCMonth();calendar()}function calendar(){el('month').textContent=fmt(Date.UTC(y,m,1)).replace(/^1 /,'');el('calendar').innerHTML='';var n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),gap=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7;for(var k=0;k<gap;k++)el('calendar').appendChild(document.createElement('div'));for(var i=1;i<=n;i++){var s=iso(Date.UTC(y,m,i)),a=state(s),b=document.createElement('button');b.textContent=i;b.disabled=!a;b.className=a&&!a.on?'off':'';(function(date){b.onclick=function(){show(date)}})(s);el('calendar').appendChild(b)}}function sync(){var w=+el('work').value,l=+el('leave').value;if(w>0&&l>0)el('cycle').value=w+l}el('work').oninput=sync;el('leave').oninput=sync;el('cycle').oninput=function(){var v=+el('cycle').value-+el('work').value;if(v>0)el('leave').value=v};el('save').onclick=function(){var f=el('first').value,w=+el('work').value,l=+el('leave').value;if(!f||!Number.isInteger(w)||!Number.isInteger(l)||w<1||l<1){el('msg').textContent='Değerleri kontrol et';return}c={first:f,work:w,leave:l};el('cycle').value=w+l;try{localStorage.setItem('gemi-config',JSON.stringify(c))}catch(e){}el('msg').textContent='✓ Ayarlar kaydedildi';show(time(q)<time(f)?f:q)};el('check').onclick=function(){show(el('query').value)};el('today').onclick=function(){var now=new Date(),s=iso(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));show(time(s)<time(c.first)?c.first:s)};el('prev').onclick=function(){m--;if(m<0){y--;m=11}calendar()};el('next').onclick=function(){m++;if(m>11){y++;m=0}calendar()};try{var saved=JSON.parse(localStorage.getItem('gemi-config'));if(saved&&saved.first&&saved.work>0&&saved.leave>0)c=saved}catch(e){}el('first').value=c.first;el('work').value=c.work;el('leave').value=c.leave;sync();show(time(q)<time(c.first)?c.first:q)})();</script></html>
