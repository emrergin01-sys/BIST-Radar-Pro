name: KUKU Lab Tests
on:
  pull_request:
    paths:
      - "kuku/**"
      - ".github/workflows/kuku-ci.yml"
  push:
    branches: [main]
    paths:
      - "kuku/**"
      - ".github/workflows/kuku-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test kuku/tests/*.test.mjs
