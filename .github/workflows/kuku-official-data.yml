name: KUKU Official Public Data
on:
  schedule:
    - cron: '30 6 * * *' # 09:30 Europe/Istanbul, UTC+3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test kuku/tests/*.test.mjs
      - run: node kuku/datahub/official-snapshot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuku-official-status
          path: artifacts/*.json
          retention-days: 30
